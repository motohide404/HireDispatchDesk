name: Test and deploy Sakura test environment

on:
  pull_request:
  push:
    branches: [main, codex/github-managed-deployment-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --prefix client
      - run: npm test --prefix client
      - run: python3 -m unittest discover -s tests -v
      - run: npm run build --prefix client
      - run: python3 deploy/github/build_release.py --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hiredispatch-${{ github.sha }}
          path: .deployment-build/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SAKURA_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sakura-test
    concurrency:
      group: hiredispatch-sakura-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hiredispatch-${{ github.sha }}
          path: .deployment-build/
      - run: python3 deploy/github/deploy_ci.py
        env:
          SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_SSH_HOST: ${{ secrets.SAKURA_SSH_HOST }}
          SAKURA_SSH_KNOWN_HOSTS: ${{ secrets.SAKURA_SSH_KNOWN_HOSTS }}
          SAKURA_PUBLIC_URL: ${{ secrets.SAKURA_PUBLIC_URL }}
